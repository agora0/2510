                    <p>【共同社10月24日电】日本官房长官木原稔在24日的记者会上宣布，首相高市早苗为出席东盟（ASEAN）相关首脑会议，将于25日至27日访问马来西亚。这将是高市就任首相后的首次外访。（完）</p>
