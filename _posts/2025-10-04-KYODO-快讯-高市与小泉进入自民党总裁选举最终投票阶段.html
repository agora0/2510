                    <p>【共同社10月4日电】日本自民党总裁选举4日举行，5名候选人均未能在第一轮投票中实现过半数。得票数前两名的前经济安全保障担当相高市早苗与农相小泉进次郎进入最终投票阶段。（完）</p>
