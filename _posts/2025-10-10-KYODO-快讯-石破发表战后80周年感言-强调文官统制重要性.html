                    <p>【共同社10月10日电】日本首相石破茂10日发表了在战后80周年之际关于先前大战的“内阁总理大臣感言”。指出由于政府失去了对军部的统制而发展为开战，强调了政治优越于军事的“文官统制”重要性。（完）</p>
