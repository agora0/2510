                    <p>【共同社10月20日电】日本维新会党首吉村洋文20日表示，当天早晨与自民党总裁高市早苗通电话，正式传达了同意与自民党组建执政联盟的意向。吉村在大阪市向媒体表示“将于晚上6点签署”协议。（完）</p>
