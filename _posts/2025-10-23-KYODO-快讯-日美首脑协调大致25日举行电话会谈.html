                    <p>【共同社10月24日电】据日本政府相关人士23日透露，首相高市早苗正在协调大致25日与美国总统特朗普举行电话会谈。这将是高市就任首相后两人首次会谈，预计将共享强化日美同盟的重要性。（完）</p>
