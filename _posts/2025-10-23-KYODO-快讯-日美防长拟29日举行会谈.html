                    <p>【共同社10月23日电】据相关人士23日透露，日美两国政府正在协调29日在东京举行防卫相小泉进次郎与国防部长赫格塞思的会谈。预计小泉将告知赫格塞思，日本计划提前对国家安全保障战略等3份安保相关文件进行修改。（完）</p>
