                    <p>【共同社10月5日电】日本政府相关人士5日透露，首相石破茂有关战后80周年的见解将提及1940年帝国议会上众议员斋藤隆夫批判日中战争的“反军演说”。石破将在10日发表见解，并召开记者会进行说明。（完）</p>
