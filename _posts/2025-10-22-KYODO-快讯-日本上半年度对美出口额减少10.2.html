                    <p>【共同社10月22日电】日本财务省22日公布的2025上半年度（4至9月）贸易统计初值显示，对美出口额为9.7115万亿日元（约合人民币4560亿元），较上年同期减少10.2%。汽车出口下滑。（完）</p>
