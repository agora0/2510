                    <p>【共同社10月29日电】美国总统特朗普29日在从日本飞往韩国的总统专机上向媒体称，对中国加征的20%“芬太尼关税”或许会下调。这是美国以合成阿片类药物“芬太尼”原料流入美国为由而针对中国商品加征的关税。（完）</p>
