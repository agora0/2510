                    <p>【共同社10月29日电】多名政府相关人士29日透露，日中两国政府拟配合在韩国召开的亚太经合组织（APEC）首脑会议，于31日举行日本首相高市早苗和中国国家主席习近平的首次首脑会谈，已就此展开协调。（完）</p>
