                    <p>【共同社伦敦10月19日电】在英国伦敦皇家阿尔伯特音乐厅举行的日本大相扑伦敦公演18日进入第四天。大之里和丰升龙这两位横纲以及平幕翔猿保持四连胜。该公演以5天的成绩决出冠军，如果出现并列则举行决定战。（完）</p>
