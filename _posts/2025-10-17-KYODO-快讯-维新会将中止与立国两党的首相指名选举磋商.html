                    <p>【共同社10月17日电】日本维新会联合党首藤田文武17日召开记者会，就与立宪民主党、国民民主党开展的有关首相指名选举的磋商称“在野党方面的合作很难”，认为继续下去也不会有成果，已告知将中止磋商。（完）</p>
