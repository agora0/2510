                    <p>【共同社庆州10月31日电】日本首相高市早苗在记者会上透露称，在日中首脑会谈上，自己对包括尖阁诸岛（中国称钓鱼岛）在内的东海问题，以及中国的稀土出口管制、日本人在华被拘问题表达了关切。（完）</p>
