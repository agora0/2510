                    <p>【共同社斯德哥尔摩10月6日电】瑞典的卡罗林斯卡学院6日宣布，2025年诺贝尔生理学或医学奖将授予日本大阪大学荣誉教授坂口志文（74岁）。坂口发现了抑制体内过剩免疫反应的“抑制性T细胞”。（完）</p>
