<div></div><div><p>（中央社華盛頓29日綜合外電報導）美國聯邦準備理事會（Fed）今天在政策會議上宣布再次降息1碼，為今年以來第2次降息。</p><p>聯準會公布最新利率決策後，市場高度關注聯準會主席鮑爾（Jerome Powell）會後發言以及利率點陣圖。（編譯：陳正健）1141030</p>
