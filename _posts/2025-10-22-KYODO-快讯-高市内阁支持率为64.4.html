                    <p>【共同社10月22日电】鉴于日本自民党总裁高市早苗当选首相并组建新内阁，共同社21、22日实施了全国紧急电话舆论调查。高市内阁成立之初的支持率为64.4%，高于石破内阁的50.7%和岸田内阁的55.7%。（完）</p>
