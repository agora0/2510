                    <p>【共同社10月30日电】即将访问韩国的日本首相高市早苗30日在官邸接受采访时表示，抵达后将与韩国总统李在明会谈，“希望使之成为有意义的会谈”。她还透露，日中首脑会谈一事正在协调之中。（完）</p>
