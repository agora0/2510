                    <p>【共同社10月27日电】丰田汽车公司27日公布的2025上半年度（4至9月）全球销量比上年同期增长4.7%，达到526.7216万辆，时隔1年创下同期新高。全球产量增加6.0%至498.5122万辆。（完）</p>
